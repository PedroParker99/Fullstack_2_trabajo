<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Villa del Globo</title>

    <!-- COLOCAR BOOTSTRAP 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- SE CONECTA CON CSS/MIESTILO.CSS -->
    <link rel="stylesheet" href="css/miestilo.css">
</head>

<body>
    <!-- ========= LAYOUT ADMIN: SIDEBAR + CONTENIDO ========= -->
    <!-- .page-wrapper: la misma "hoja blanca" que usa index.html, viene de miestilo.css -->
    <!-- El fondo de nubes sigue viviendo en el <body>; el page-wrapper se dibuja encima -->
    <div class="page-wrapper">
        <!-- d-flex pone al sidebar y al <main> uno al lado del otro -->
        <div class="d-flex">

        <!-- ===== SIDEBAR ===== -->
        <!-- flex-shrink-0: no se encoge -->
        <!-- vh-100: ocupa el 100% del alto de la pantalla -->
        <!-- position-sticky top-0: se queda fijo aunque hagas scroll en el contenido -->
        <nav class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white vh-100 position-sticky top-0"
            style="width: 260px;">

            <!-- Marca del panel -->
            <a href="admin.html" class="d-flex align-items-center mb-3 text-white text-decoration-none">
                <span class="fs-4">🎈 Panel Admin</span>
            </a>
            <hr>

            <!-- === Links de navegación === -->
            <!-- nav-pills + flex-column: menú vertical con fondo tipo "píldora" en el activo -->
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="perfilAdmin.html" class="nav-link text-white">
                        <i class="bi bi-house-door me-2"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a href="adminPedidos.html" class="nav-link text-white">
                        <i class="bi bi-bag-check me-2"></i>Pedidos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="adminProductos.html" class="nav-link text-white">
                        <i class="bi bi-box-seam me-2"></i>Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="adminClientes.html" class="nav-link active" aria-current="page">
                        <i class="bi bi-people me-2"></i>Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a href="adminDescuentos.html" class="nav-link text-white">
                        <i class="bi bi-percent me-2"></i>Descuentos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="adminInformes.html" class="nav-link text-white">
                        <i class="bi bi-graph-up me-2"></i>Informe y Estadísticas
                    </a>
                </li>
            </ul>
            <hr>

            <!-- === Pie del sidebar: usuario conectado === -->
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-2 fs-4"></i>
                    <strong>Admin</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                    <li><a class="dropdown-item" href="#">Configuración</a></li>
                    <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                </ul>
            </div>
        </nav>
        <!-- ===== FIN SIDEBAR ===== -->

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <!-- flex-grow-1: ocupa todo el espacio restante que el sidebar no usa -->
        <main class="flex-grow-1 p-4">
            <h1 class="mb-1">Bienvenido, Admin</h1>
            <p class="text-muted">Menú Clientes.</p>
        </main>
        <!-- ===== FIN CONTENIDO PRINCIPAL ===== -->

        </div>
        <!-- cierra .d-flex -->

    </div>
    <!-- cierra .page-wrapper -->
    <!-- ========= FIN LAYOUT ADMIN ========= -->

</body>

</html>
